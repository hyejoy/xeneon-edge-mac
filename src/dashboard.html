<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; connect-src https://api.open-meteo.com https://ipapi.co"
    />
    <title>Xeneon Edge</title>
    <style>
      /* 2560x720 기준 px로 디자인, 다른 크기 창에서는 JS가 zoom으로 맞춘다 */
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: 2560px;
        height: 720px;
        overflow: hidden;
        color: #f4f7fc;
        user-select: none;
        font-family: -apple-system, "Apple SD Gothic Neo", sans-serif;
      }
      /* 글라스가 비쳐 보이도록 은은한 색 번짐 배경 */
      body {
        background:
          radial-gradient(
            900px 520px at 8% 15%,
            rgba(80, 105, 160, 0.22),
            transparent 60%
          ),
          radial-gradient(
            820px 520px at 52% 105%,
            rgba(110, 95, 155, 0.15),
            transparent 60%
          ),
          radial-gradient(
            760px 480px at 93% 10%,
            rgba(75, 120, 155, 0.15),
            transparent 60%
          ),
          linear-gradient(135deg, #0a0d16, #0e1220 50%, #090b13);
      } /* 검정과 남색 사이 */
      main {
        display: grid;
        grid-template-columns: 680px 1fr 540px;
        gap: 20px;
        height: 100%;
        padding: 20px;
      }

      /* ---- 공통 글라스 ---- */
      /* 두꺼운 유리: 밝은 바깥 테두리 + 안쪽 베벨 띠 + 위 반사광, 아래 반사 */
      .glass {
        position: relative;
        border-radius: 36px;
        background: linear-gradient(
          170deg,
          rgba(255, 255, 255, 0.11),
          rgba(255, 255, 255, 0.03) 45%,
          rgba(255, 255, 255, 0.07)
        );
        border: 1px solid rgba(255, 255, 255, 0.34);
        box-shadow:
          inset 0 0 0 4px rgba(255, 255, 255, 0.035),
          /* 베벨 띠 */ inset 0 0 0 5px rgba(255, 255, 255, 0.1),
          /* 안쪽 테두리 */ inset 0 2px 1px -1px rgba(255, 255, 255, 0.45),
          /* 위 반사광 */ inset 0 -2px 2px -1px rgba(255, 255, 255, 0.14),
          /* 아래 반사 */ inset 7px 0 14px -10px rgba(255, 255, 255, 0.25),
          /* 왼쪽 가장자리 굴절 */ inset -7px 0 14px -10px
            rgba(255, 255, 255, 0.15),
          0 18px 50px rgba(0, 0, 0, 0.45);
        backdrop-filter: blur(28px) saturate(150%);
      }
      /* 위쪽 가장자리를 따라 흐르는 하이라이트 */
      .glass::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        pointer-events: none;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.1), transparent 18%),
          radial-gradient(
            40% 12% at 18% 0%,
            rgba(255, 255, 255, 0.22),
            transparent 70%
          );
      }
      .tile {
        border-radius: 999px;
        background: linear-gradient(
          175deg,
          rgba(255, 255, 255, 0.09),
          rgba(255, 255, 255, 0.03)
        );
        border: 1px solid rgba(255, 255, 255, 0.26);
        box-shadow:
          inset 0 2px 1px -1px rgba(255, 255, 255, 0.45),
          inset 0 -2px 2px -1px rgba(255, 255, 255, 0.12),
          inset 0 0 0 3px rgba(255, 255, 255, 0.03),
          0 6px 16px rgba(0, 0, 0, 0.25);
      }
      .label {
        font-size: 17px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: rgba(244, 247, 252, 0.55);
      }
      .wi {
        display: block;
        filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.18));
      }

      /* ---- 날씨 ---- */
      #weather {
        display: grid;
        grid-template-rows: 1fr auto auto;
        gap: 16px;
      }
      .now {
        padding: 26px 30px;
        display: grid;
        grid-template-columns: 1fr 250px;
        gap: 0 20px;
      }
      .now .info {
        display: flex;
        flex-direction: column;
      }
      .now .city {
        font-size: 24px;
        font-weight: 600;
        margin-top: 8px;
      }
      .temp {
        font-size: 136px;
        font-weight: 100;
        line-height: 1;
        margin: 14px 0 4px -6px;
      }
      .desc {
        font-size: 26px;
        color: rgba(244, 247, 252, 0.8);
      }
      .hl {
        font-size: 21px;
        color: rgba(244, 247, 252, 0.65);
        margin-top: 6px;
      }
      .hl b {
        color: #f4f7fc;
        font-weight: 500;
        margin: 0 14px 0 6px;
      }
      .now .pane {
        display: grid;
        place-items: center;
        border-radius: 44px;
      }
      .now .pane .wi {
        width: 190px;
        height: 190px;
        filter: drop-shadow(0 0 18px rgba(255, 255, 255, 0.22));
      }
      .meta {
        grid-column: 1 / -1;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
        margin-top: 18px;
      }
      /* 보조 정보: 유리 효과를 빼고 살짝 가라앉은 어두운 칸 */
      .meta div {
        padding: 9px 18px;
        border-radius: 16px;
        background: linear-gradient(180deg, rgba(0, 0, 0, 0.16), rgba(0, 0, 0, 0.26));
        border: 1px solid rgba(255, 255, 255, 0.07);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
      }
      .meta b {
        color: rgba(244, 247, 252, 0.82);
      }
      .meta .label {
        font-size: 13px;
      }
      .meta b {
        display: block;
        font-size: 22px;
        font-weight: 500;
        margin-top: 2px;
      }
      .hours {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 10px;
      }
      .hour {
        border-radius: 24px;
        padding: 16px 0 14px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
      }
      .hour .h {
        font-size: 18px;
        color: rgba(244, 247, 252, 0.65);
      }
      .hour .wi {
        width: 50px;
        height: 50px;
      }
      .hour .t {
        font-size: 28px;
        font-weight: 300;
      }
      .hour .p {
        font-size: 15px;
        color: #7fbcff;
      }
      .hour.past {
        opacity: 0.38;
      } /* 지난 시간은 흐리게 */
      .day {
        border-radius: 24px;
        padding: 12px 32px;
        display: grid;
        grid-template-columns: 1fr 56px 200px;
        align-items: center;
        font-size: 24px;
      }
      .day .wi {
        width: 46px;
        height: 46px;
      }
      .day .t {
        text-align: right;
        font-weight: 300;
      }
      .err {
        padding: 40px;
        color: #ffb3b3;
        font-size: 24px;
      }

      /* ---- 달력 ---- */
      #cal {
        padding: 24px 30px 18px;
        display: flex;
        flex-direction: column;
      }
      .head {
        display: flex;
        align-items: baseline;
        gap: 20px;
        margin-bottom: 10px;
      }
      .head span {
        font-size: 22px;
        color: rgba(244, 247, 252, 0.55);
      }
      .head h1 {
        font-size: 42px;
        font-weight: 300;
        letter-spacing: 0.02em;
      }
      .head h1 b {
        font-weight: 600;
      }
      .dow,
      .week {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
      }
      .dow div {
        text-align: center;
        font-size: 17px;
        letter-spacing: 0.18em;
        color: rgba(244, 247, 252, 0.5);
        padding: 6px 0;
      }
      .weeks {
        flex: 1;
        display: flex;
        flex-direction: column;
      }
      .week {
        flex: 1;
        position: relative;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        overflow: hidden;
      }
      .cell {
        padding: 6px 12px;
        text-align: right;
        font-size: 21px;
        font-weight: 300;
        border-left: 1px solid rgba(255, 255, 255, 0.05);
      }
      .cell:first-child {
        border-left: 0;
      }
      .cell.sun {
        color: #ff9a9a;
      }
      .cell.sat {
        color: #9cc4ff;
      }
      .cell.out {
        opacity: 0.28;
      }
      .cell.today span {
        display: inline-block;
        min-width: 38px;
        padding: 3px 8px;
        border-radius: 19px;
        text-align: center;
        font-weight: 600;
        color: #fff;
        background: rgba(130, 170, 255, 0.45);
        border: 1px solid rgba(255, 255, 255, 0.55);
        box-shadow: 0 0 14px rgba(130, 170, 255, 0.6);
      }
      /* shortcut: lane이 행 높이를 넘으면 잘린다(5주 달 약 3줄, 6주 달 약 2줄), 겹치는 계획이 많아지면 "+N" 표시 추가 */
      .bar {
        position: absolute;
        height: 28px;
        line-height: 26px;
        padding: 0 14px;
        font-size: 18px;
        font-weight: 600;
        color: #1d2230;
        background: var(--c);
        border: 1px solid color-mix(in srgb, var(--c), white 45%); /* 파스텔 그대로 */
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.45);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .bar.s {
        border-top-left-radius: 14px;
        border-bottom-left-radius: 14px;
      }
      .bar.e {
        border-top-right-radius: 14px;
        border-bottom-right-radius: 14px;
      }

      /* ---- 시계 + 메모: 오른쪽 칸을 1:2로 ---- */
      .side {
        display: grid;
        grid-template-rows: 1fr 2fr;
        gap: 20px;
        min-height: 0;
      }
      #clock {
        display: flex;
        align-items: flex-end;
        justify-content: center;
        padding-bottom: 58px;
        font-family:
          "Avenir Next",
          -apple-system,
          sans-serif;
        font-variant-numeric: tabular-nums;
      }
      #clock .hm {
        font-size: 132px;
        font-weight: 100;
        line-height: 0.8;
        letter-spacing: 0.01em;
      }
      #clock .sx {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        margin-left: 14px;
      }
      #clock .ap {
        font-size: 22px;
        font-weight: 500;
        letter-spacing: 0.14em;
        color: rgba(244, 247, 252, 0.7);
        margin: 0 0 8px 3px;
      }
      #clock .sec {
        font-size: 58px;
        font-weight: 200;
        line-height: 0.8;
        color: rgba(244, 247, 252, 0.85);
      }
      #memo {
        min-height: 0;
        padding: 24px 24px 20px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      #memo .clip {
        position: absolute;
        top: -30px;
        right: 44px;
        width: 38px;
        height: 84px;
        transform: rotate(6deg);
        filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.45));
      }
      .notes {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        gap: 10px;
        overflow: hidden;
      }
      /* shortcut: 메모가 패널 높이를 넘으면 아래쪽이 잘린다, 많아지면 자동 스크롤/페이지 넘김 추가 */
      .note {
        flex-shrink: 0;
        border-radius: 26px;
        padding: 11px 24px;
        background: var(--c);
        border-color: color-mix(
          in srgb,
          var(--c),
          white 45%
        ); /* 달력 막대와 같은 파스텔 */
        font-size: 19px;
        line-height: 1.4;
        white-space: pre-wrap;
        word-break: break-word;
        color: #1d2230;
      }
      .note::first-line {
        font-weight: 700;
      }
      .empty {
        color: rgba(244, 247, 252, 0.5);
        font-size: 19px;
      }
    </style>
  </head>
  <body>
    <main>
      <section id="weather"></section>
      <section id="cal" class="glass"></section>
      <div class="side">
        <section id="clock" class="glass"></section>
        <section id="memo" class="glass">
          <svg
            class="clip"
            viewBox="0 0 44 80"
            fill="none"
            stroke-width="3"
            stroke-linecap="round"
            aria-hidden="true"
          >
            <defs>
              <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#ffffff" />
                <stop offset=".45" stop-color="#9aa3b2" />
                <stop offset=".7" stop-color="#e8ecf2" />
                <stop offset="1" stop-color="#7d8696" />
              </linearGradient>
            </defs>
            <path
              stroke="url(#silver)"
              d="M17 22V54a5 5 0 0 0 10 0V14a8 8 0 0 0 -16 0V58a11 11 0 0 0 22 0V26"
            />
          </svg>
          <div class="label">Memo</div>
          <div class="notes" id="notes"></div>
        </section>
      </div>
    </main>
    <script src="calendar.js"></script>
    <script src="icons.js"></script>
    <script src="dashboard.js"></script>
  </body>
</html>
