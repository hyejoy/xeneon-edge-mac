<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; connect-src https://api.open-meteo.com https://ipapi.co">
<title>Xeneon Edge</title>
<style>
  /* 2560x720 기준 px로 디자인, 다른 크기 창에서는 JS가 zoom으로 맞춘다 */
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 2560px; height: 720px; overflow: hidden; background: #07090f; color: #e8ecf4;
    font-family: -apple-system, 'Apple SD Gothic Neo', sans-serif; user-select: none; }
  main { display: grid; grid-template-columns: 680px 1fr 540px; gap: 20px; height: 100%; padding: 20px; }
  .card { background: linear-gradient(160deg, #151a26, #0d1018); border: 1px solid #222a3a; border-radius: 24px; }

  /* 날씨 */
  #weather { display: grid; grid-template-rows: 1fr auto auto; gap: 16px; background: none; border: 0; }
  .now { padding: 28px 36px; display: grid; grid-template-columns: 1fr auto; align-content: center; row-gap: 8px; }
  .city { grid-column: 1 / -1; font-size: 26px; letter-spacing: .08em; color: #8f9bb3; }
  .temp { font-size: 130px; font-weight: 200; line-height: 1; }
  .icon { font-size: 104px; align-self: center; }
  .desc { font-size: 30px; color: #c3cad8; }
  .hl { font-size: 30px; color: #c3cad8; text-align: right; }
  .meta { grid-column: 1 / -1; display: flex; gap: 26px; margin-top: 18px; font-size: 22px; color: #8f9bb3; }
  .meta b { color: #e8ecf4; font-weight: 500; margin-left: 8px; }
  .hours { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .hour { padding: 14px 0; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .hour .h { font-size: 20px; color: #8f9bb3; } .hour .i { font-size: 40px; }
  .hour .t { font-size: 30px; font-weight: 500; } .hour .p { font-size: 17px; color: #7c8db5; }
  .hour.past { opacity: .4; } /* 지난 시간은 흐리게 */
  .day { padding: 14px 36px; display: grid; grid-template-columns: 1fr 60px 180px; align-items: center; font-size: 28px; }
  .day .i { font-size: 40px; }
  .day .t { text-align: right; color: #c3cad8; }
  .err { padding: 40px; color: #f08a8a; font-size: 24px; }

  /* 달력 */
  #cal { padding: 24px 32px 20px; display: flex; flex-direction: column; }
  .head { display: flex; align-items: baseline; gap: 20px; margin-bottom: 10px; }
  .head h1 { font-size: 44px; font-weight: 600; }
  .head span { font-size: 24px; color: #7c8db5; }
  .dow, .week { display: grid; grid-template-columns: repeat(7, 1fr); }
  .dow div { text-align: center; font-size: 20px; letter-spacing: .1em; color: #6b7690; padding: 6px 0; }
  .weeks { flex: 1; display: flex; flex-direction: column; }
  .week { flex: 1; position: relative; border-top: 1px solid #1d2433; overflow: hidden; }
  .cell { padding: 6px 12px; text-align: right; font-size: 22px; border-left: 1px solid #161c28; }
  .cell:first-child { border-left: 0; }
  .cell.sun { color: #f08a8a; } .cell.sat { color: #8ab4f0; }
  .cell.out { opacity: .3; }
  .cell.today span { display: inline-block; min-width: 38px; padding: 4px 8px; border-radius: 19px; background: #6f9cff; color: #07090f; font-weight: 700; text-align: center; }
  /* shortcut: lane이 행 높이를 넘으면 잘린다(5주 달 약 3줄, 6주 달 약 2줄), 겹치는 계획이 많아지면 "+N" 표시 추가 */
  .bar { position: absolute; height: 28px; line-height: 28px; padding: 0 14px; font-size: 19px; font-weight: 600; color: #1d2230;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar.s { border-top-left-radius: 15px; border-bottom-left-radius: 15px; }
  /* 메모 */
  /* 시계 + 메모: 오른쪽 칸을 1:2로 나눔 */
  .side { display: grid; grid-template-rows: 1fr 2fr; gap: 20px; min-height: 0; }
  #clock { display: flex; align-items: center; justify-content: center; font-size: 104px; font-weight: 200;
    font-variant-numeric: tabular-nums; letter-spacing: .02em; }
  #clock small { font-size: 36px; font-weight: 500; color: #8f9bb3; margin: 44px 0 0 14px; letter-spacing: .08em; }
  #memo { min-height: 0; padding: 20px 22px; display: flex; flex-direction: column; gap: 10px; overflow: hidden; }
  #memo h2 { font-size: 26px; font-weight: 600; color: #8f9bb3; }
  /* shortcut: 메모가 패널 높이를 넘으면 아래쪽이 잘린다, 많아지면 자동 스크롤/페이지 넘김 추가 */
  .note { flex-shrink: 0; padding: 12px 18px; border-radius: 14px; color: #1d2230; font-size: 19px; line-height: 1.4; white-space: pre-wrap; word-break: break-word; }
  .note::first-line { font-weight: 700; }
  .bar.e { border-top-right-radius: 15px; border-bottom-right-radius: 15px; }
</style>
</head>
<body>
<main>
  <section id="weather" class="card"></section>
  <section id="cal" class="card"></section>
  <div class="side">
    <section id="clock" class="card"></section>
    <section id="memo" class="card"></section>
  </div>
</main>
<script src="calendar.js"></script>
<script src="dashboard.js"></script>
</body>
</html>
